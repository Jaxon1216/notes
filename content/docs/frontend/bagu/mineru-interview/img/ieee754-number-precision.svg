<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#312e81" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1310" cy="110" r="70" fill="#fde68a" opacity="0.55"/>
  <circle cx="90" cy="820" r="94" fill="#c4b5fd" opacity="0.4"/>

  <text x="76" y="78" font-family="Noto Sans SC, sans-serif" font-size="42" font-weight="700" fill="#1e1b4b">为什么 0.1 + 0.2 不等于 0.3</text>
  <text x="78" y="120" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#475569">十进制小数先转为二进制近似值，再经过 IEEE 754 双精度舍入</text>

  <text x="82" y="188" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#312e81">Number 的 64 位布局</text>
  <g filter="url(#shadow)">
    <rect x="82" y="216" width="150" height="112" rx="20" fill="#ef4444"/>
    <rect x="244" y="216" width="292" height="112" rx="20" fill="#f59e0b"/>
    <rect x="548" y="216" width="810" height="112" rx="20" fill="#6366f1"/>
    <text x="157" y="260" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#ffffff">符号 S</text>
    <text x="157" y="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#fee2e2">1 bit</text>
    <text x="390" y="260" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#ffffff">指数 E</text>
    <text x="390" y="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#fef3c7">11 bits · 偏移 1023</text>
    <text x="953" y="260" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#ffffff">尾数 Fraction</text>
    <text x="953" y="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#e0e7ff">52 bits · 有效精度约 15–17 位十进制数字</text>
  </g>

  <text x="720" y="370" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#475569">数值 = (-1)^S × 1.fraction × 2^(E-1023)</text>

  <g filter="url(#shadow)">
    <path d="M88 425 Q88 397 116 397 H444 Q472 397 472 425 V642 Q472 670 444 670 H116 Q88 670 88 642 Z" fill="#ffffff" stroke="#06b6d4" stroke-width="3"/>
    <circle cx="145" cy="459" r="28" fill="#cffafe"/>
    <text x="145" y="467" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#0e7490">1</text>
    <text x="190" y="466" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="700" fill="#164e63">转换成二进制</text>
    <text x="126" y="519" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#0f172a">0.1 (base 10) = 0.0001100110011… (base 2)</text>
    <text x="126" y="557" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#0f172a">0.2 (base 10) = 0.0011001100110… (base 2)</text>
    <path d="M126 584 H430" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="126" y="620" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#0e7490">“0011” 无限循环，无法有限存下</text>

    <path d="M528 425 Q528 397 556 397 H884 Q912 397 912 425 V642 Q912 670 884 670 H556 Q528 670 528 642 Z" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="585" cy="459" r="28" fill="#fef3c7"/>
    <text x="585" y="467" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#92400e">2</text>
    <text x="630" y="466" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="700" fill="#78350f">截断并舍入</text>
    <rect x="570" y="505" width="300" height="50" rx="12" fill="#eef2ff"/>
    <text x="720" y="537" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#3730a3">保留 52 位 fraction</text>
    <path d="M570 580 H790" stroke="#6366f1" stroke-width="8"/>
    <path d="M790 580 H870" stroke="#ef4444" stroke-width="8" stroke-dasharray="7 6"/>
    <line x1="790" y1="564" x2="790" y2="596" stroke="#111827" stroke-width="3"/>
    <text x="680" y="620" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#4338ca">可存部分</text>
    <text x="830" y="620" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#b91c1c">舍入部分</text>

    <path d="M968 425 Q968 397 996 397 H1324 Q1352 397 1352 425 V642 Q1352 670 1324 670 H996 Q968 670 968 642 Z" fill="#ffffff" stroke="#db2777" stroke-width="3"/>
    <circle cx="1025" cy="459" r="28" fill="#fce7f3"/>
    <text x="1025" y="467" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#9d174d">3</text>
    <text x="1070" y="466" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="700" fill="#831843">近似值相加</text>
    <text x="1010" y="519" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#0f172a">stored(0.1) + stored(0.2)</text>
    <rect x="1010" y="549" width="300" height="69" rx="18" fill="url(#result)"/>
    <text x="1160" y="591" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#ffffff">0.30000000000000004</text>
  </g>

  <line x1="472" y1="533" x2="528" y2="533" stroke="#64748b" stroke-width="6"/>
  <polygon points="528,533 510,522 510,544" fill="#64748b"/>
  <line x1="912" y1="533" x2="968" y2="533" stroke="#64748b" stroke-width="6"/>
  <polygon points="968,533 950,522 950,544" fill="#64748b"/>

  <g>
    <rect x="88" y="731" width="390" height="110" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="116" y="771" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#065f46">按尺度比较近似值</text>
    <text x="116" y="807" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#047857">abs(a - b) &lt;= epsilon * scale</text>

    <rect x="525" y="731" width="390" height="110" rx="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="553" y="771" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#1e40af">金额计算</text>
    <text x="553" y="807" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#1d4ed8">转换为最小货币单位整数，或用 decimal 库</text>

    <rect x="962" y="731" width="390" height="110" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="990" y="771" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#9a3412">大整数边界</text>
    <text x="990" y="807" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#c2410c">精确整数仅到 2^53 - 1；更大整数使用 BigInt</text>
  </g>
</svg>
