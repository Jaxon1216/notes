<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="keep-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#DFF5E5"/>
    </linearGradient>
    <filter id="keep-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1F2329" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#keep-bg)"/>
  <circle cx="1075" cy="600" r="95" fill="#EAE2FE" opacity="0.55"/>
  <text x="60" y="62" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#1F2329">KeepAlive：实例复用、激活切换与缓存淘汰</text>
  <text x="60" y="94" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#646A73">缓存的是组件实例及其渲染子树，不是接口响应或任意页面快照</text>

  <rect x="60" y="135" width="310" height="480" rx="24" fill="#FFFFFF" stroke="#5178C6" stroke-width="2" filter="url(#keep-shadow)"/>
  <rect x="82" y="155" width="266" height="44" rx="22" fill="#5178C6"/>
  <text x="215" y="183" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">当前动态组件 / RouterView</text>

  <ellipse cx="215" cy="275" rx="105" ry="62" fill="#F0F4FC" stroke="#5178C6" stroke-width="3"/>
  <text x="215" y="266" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#1F2329">组件 A 活跃</text>
  <text x="215" y="292" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">可见且响应更新</text>

  <rect x="105" y="390" width="220" height="120" rx="18" fill="#FEF1CE" stroke="#D4B45B" stroke-width="2"/>
  <text x="215" y="420" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#1F2329">切换到组件 B</text>
  <text x="128" y="451" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">A：deactivated</text>
  <text x="128" y="477" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">B：mounted + activated</text>

  <line x1="215" y1="337" x2="215" y2="372" stroke="#BBBFC4" stroke-width="4"/>
  <polygon points="215,389 204,368 226,368" fill="#BBBFC4"/>

  <rect x="445" y="135" width="350" height="480" rx="24" fill="#FFFFFF" stroke="#8569CB" stroke-width="2" filter="url(#keep-shadow)"/>
  <rect x="467" y="155" width="306" height="44" rx="22" fill="#8569CB"/>
  <text x="620" y="183" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">KeepAlive 缓存池</text>

  <rect x="485" y="232" width="270" height="86" rx="17" fill="#EAE2FE" stroke="#8569CB" stroke-width="2"/>
  <circle cx="522" cy="275" r="21" fill="#8569CB"/>
  <text x="522" y="282" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">A</text>
  <text x="560" y="263" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">缓存实例 A</text>
  <text x="560" y="289" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">保留状态与 DOM 子树</text>

  <rect x="485" y="340" width="270" height="86" rx="17" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
  <circle cx="522" cy="383" r="21" fill="#5178C6"/>
  <text x="522" y="390" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">C</text>
  <text x="560" y="371" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">缓存实例 C</text>
  <text x="560" y="397" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">最近一次使用更早</text>

  <rect x="485" y="470" width="270" height="94" rx="17" fill="#FEE3E2" stroke="#D25D5A" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="620" y="500" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">max 超限 / 规则不匹配</text>
  <text x="620" y="528" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">淘汰最久未使用项</text>
  <text x="620" y="551" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">真正卸载并释放实例</text>

  <path d="M370 275 C400 275 415 275 445 275" fill="none" stroke="#BBBFC4" stroke-width="4"/>
  <polygon points="445,275 424,264 424,286" fill="#BBBFC4"/>
  <text x="407" y="258" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">停用</text>

  <path d="M485 318 C430 340 415 365 370 410" fill="none" stroke="#8569CB" stroke-width="4" stroke-dasharray="8 6"/>
  <polygon points="370,410 378,387 393,402" fill="#8569CB"/>
  <text x="420" y="360" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">再次进入：复用</text>

  <rect x="870" y="135" width="270" height="480" rx="24" fill="#FFFFFF" stroke="#509863" stroke-width="2" filter="url(#keep-shadow)"/>
  <rect x="892" y="155" width="226" height="44" rx="22" fill="#509863"/>
  <text x="1005" y="183" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">匹配与生命周期</text>

  <rect x="905" y="232" width="200" height="78" rx="16" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
  <text x="1005" y="259" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">include / exclude</text>
  <text x="1005" y="285" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">按组件 name 匹配</text>

  <rect x="905" y="335" width="200" height="78" rx="16" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
  <text x="1005" y="362" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">activated</text>
  <text x="1005" y="388" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">缓存实例重新可见</text>

  <rect x="905" y="438" width="200" height="78" rx="16" fill="#EAE2FE" stroke="#8569CB" stroke-width="2"/>
  <text x="1005" y="465" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">deactivated</text>
  <text x="1005" y="491" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">移入缓存但未卸载</text>

  <text x="1005" y="555" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">SSR 期间不调用</text>
  <text x="1005" y="577" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">activated / deactivated</text>

  <rect x="180" y="642" width="840" height="36" rx="18" fill="#1F2329"/>
  <text x="600" y="666" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">数据刷新应绑定“重新激活”或路由变化，不要误认为 beforeRouteEnter 会在每次渲染执行</text>
</svg>
