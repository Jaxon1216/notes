<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="fiber-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="fiber-scheduler" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="fiber-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#64748B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#fiber-bg)"/>
  <text x="58" y="66" fill="#0F172A" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700">Fiber 双缓冲：可中断 Render，一致性 Commit</text>
  <text x="58" y="102" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="15">current 保持屏幕稳定，workInProgress 在后台计算下一版本</text>

  <g filter="url(#fiber-shadow)">
    <rect x="58" y="140" width="1084" height="90" rx="22" fill="url(#fiber-scheduler)"/>
    <text x="86" y="177" fill="#FFFFFF" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700">Scheduler + Lanes</text>
    <text x="86" y="207" fill="#DBEAFE" font-family="Noto Sans SC, sans-serif" font-size="13">按优先级选择更新；紧急输入可打断非紧急 transition</text>

    <rect x="620" y="161" width="138" height="48" rx="24" fill="#FFFFFF" opacity="0.94"/>
    <text x="689" y="191" text-anchor="middle" fill="#1D4ED8" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700">Sync lane</text>

    <rect x="776" y="161" width="160" height="48" rx="24" fill="#FFFFFF" opacity="0.88"/>
    <text x="856" y="191" text-anchor="middle" fill="#6D28D9" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700">Transition lane</text>

    <rect x="954" y="161" width="158" height="48" rx="24" fill="#FFFFFF" opacity="0.82"/>
    <text x="1033" y="191" text-anchor="middle" fill="#475569" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700">Idle work</text>
  </g>

  <polyline points="884,230 884,262 818,262 818,286" fill="none" stroke="#7C3AED" stroke-width="4"/>
  <polygon points="818,298 811,284 825,284" fill="#7C3AED"/>

  <g filter="url(#fiber-shadow)">
    <rect x="58" y="282" width="442" height="332" rx="24" fill="#FFFFFF" stroke="#5178C6" stroke-width="2"/>
    <rect x="58" y="282" width="442" height="58" rx="24" fill="#F0F4FC"/>
    <rect x="58" y="320" width="442" height="20" fill="#F0F4FC"/>
    <text x="86" y="319" fill="#1E3A8A" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700">current 树</text>
    <text x="380" y="318" fill="#5178C6" font-family="Noto Sans SC, sans-serif" font-size="13">已提交 / 屏幕可见</text>

    <rect x="202" y="368" width="150" height="52" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="277" y="400" text-anchor="middle" fill="#1E3A8A" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">App Fiber</text>

    <rect x="94" y="480" width="150" height="52" rx="14" fill="#FFFFFF" stroke="#5178C6" stroke-width="2"/>
    <text x="169" y="512" text-anchor="middle" fill="#1F2329" font-family="Noto Sans SC, sans-serif" font-size="14">Sidebar Fiber</text>

    <rect x="310" y="480" width="150" height="52" rx="14" fill="#FFFFFF" stroke="#5178C6" stroke-width="2"/>
    <text x="385" y="512" text-anchor="middle" fill="#1F2329" font-family="Noto Sans SC, sans-serif" font-size="14">Content Fiber</text>

    <polyline points="277,420 277,452 169,452 169,468" fill="none" stroke="#94A3B8" stroke-width="3"/>
    <polygon points="169,478 163,466 175,466" fill="#94A3B8"/>
    <polyline points="277,420 277,452 385,452 385,468" fill="none" stroke="#94A3B8" stroke-width="3"/>
    <polygon points="385,478 379,466 391,466" fill="#94A3B8"/>

    <rect x="145" y="564" width="264" height="28" rx="14" fill="#EFF6FF"/>
    <text x="277" y="583" text-anchor="middle" fill="#5178C6" font-family="Noto Sans SC, sans-serif" font-size="12">DOM 与组件状态以此树为准</text>
  </g>

  <g filter="url(#fiber-shadow)">
    <rect x="642" y="282" width="500" height="332" rx="24" fill="#0F172A" stroke="#8569CB" stroke-width="2"/>
    <rect x="642" y="282" width="500" height="58" rx="24" fill="#1E293B"/>
    <rect x="642" y="320" width="500" height="20" fill="#1E293B"/>
    <text x="672" y="319" fill="#C4B5FD" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700">workInProgress 树</text>
    <text x="1000" y="318" fill="#A78BFA" font-family="Noto Sans SC, sans-serif" font-size="13">Render 中</text>

    <rect x="814" y="368" width="158" height="52" rx="14" fill="#4C1D95" stroke="#A78BFA" stroke-width="2"/>
    <text x="893" y="400" text-anchor="middle" fill="#F5F3FF" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">App Fiber'</text>

    <rect x="688" y="480" width="158" height="52" rx="14" fill="#1E293B" stroke="#8569CB" stroke-width="2"/>
    <text x="767" y="512" text-anchor="middle" fill="#E2E8F0" font-family="Noto Sans SC, sans-serif" font-size="14">Sidebar Fiber'</text>

    <rect x="940" y="480" width="158" height="52" rx="14" fill="#FEF1CE" stroke="#D4B45B" stroke-width="3"/>
    <text x="1019" y="503" text-anchor="middle" fill="#1F2329" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">Content Fiber'</text>
    <text x="1019" y="522" text-anchor="middle" fill="#92400E" font-family="Noto Sans SC, sans-serif" font-size="11">包含待提交 flags</text>

    <polyline points="893,420 893,452 767,452 767,468" fill="none" stroke="#64748B" stroke-width="3"/>
    <polygon points="767,478 761,466 773,466" fill="#64748B"/>
    <polyline points="893,420 893,452 1019,452 1019,468" fill="none" stroke="#A78BFA" stroke-width="3"/>
    <polygon points="1019,478 1013,466 1025,466" fill="#A78BFA"/>

    <rect x="716" y="564" width="354" height="28" rx="14" fill="#1E293B"/>
    <text x="893" y="583" text-anchor="middle" fill="#CBD5E1" font-family="Noto Sans SC, sans-serif" font-size="12">可暂停、恢复、重做或整棵丢弃</text>
  </g>

  <g>
    <polyline points="352,394 590,394 590,370 814,370" fill="none" stroke="#A78BFA" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="590" y="360" text-anchor="middle" fill="#7C3AED" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700">alternate</text>
    <polyline points="169,532 169,542 767,542 767,532" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="8 7"/>
    <polyline points="385,532 385,552 1019,552 1019,532" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="8 7"/>
  </g>

  <g filter="url(#fiber-shadow)">
    <rect x="390" y="636" width="420" height="46" rx="23" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
    <text x="600" y="665" text-anchor="middle" fill="#14532D" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">Commit：同步写 DOM，并把 workInProgress 切换为 current</text>
  </g>
  <polyline points="892,614 892,659 824,659" fill="none" stroke="#509863" stroke-width="4"/>
  <polygon points="812,659 826,652 826,666" fill="#509863"/>
</svg>
