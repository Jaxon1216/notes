<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="weakGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#509863"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="28" fill="#F8FAFC"/>
  <circle cx="1150" cy="92" r="86" fill="#DFF5E5" opacity="0.72"/>
  <path d="M70 120 C252 22 454 40 622 102" fill="none" stroke="url(#weakGradient)" stroke-width="8" stroke-linecap="round" opacity="0.18"/>

  <text x="70" y="70" font-size="30" font-weight="700" fill="#0F172A">WeakMap：弱的是键的可达性</text>
  <text x="70" y="104" font-size="15" fill="#64748B">弱关联不阻止垃圾回收；何时回收由 GC 决定，程序无法枚举或观察时间点</text>

  <!-- two-panel backgrounds -->
  <rect x="70" y="154" width="548" height="430" rx="30" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
  <rect x="662" y="154" width="548" height="430" rx="30" fill="#FEE3E2" stroke="#D25D5A" stroke-width="2"/>

  <rect x="100" y="178" width="154" height="42" rx="21" fill="#5178C6"/>
  <text x="177" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">存在强引用</text>
  <rect x="692" y="178" width="176" height="42" rx="21" fill="#D25D5A"/>
  <text x="780" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">移除最后强引用</text>

  <!-- panel 1 connectors -->
  <polyline points="198,314 294,314" fill="none" stroke="#5178C6" stroke-width="5" stroke-linecap="round"/>
  <polygon points="294,314 278,305 278,323" fill="#5178C6"/>
  <text x="246" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#315EA8">强引用</text>

  <polyline points="198,468 284,468 284,382 324,382" fill="none" stroke="#8569CB" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="324,382 310,374 310,390" fill="#8569CB"/>
  <text x="237" y="452" text-anchor="middle" font-size="13" font-weight="700" fill="#5D469C">弱键</text>

  <polyline points="440,366 440,424" fill="none" stroke="#509863" stroke-width="4" stroke-linecap="round"/>
  <polygon points="440,424 432,410 448,410" fill="#509863"/>
  <text x="475" y="402" font-size="13" font-weight="700" fill="#245C33">关联值</text>

  <!-- panel 2 connectors -->
  <line x1="778" y1="304" x2="874" y2="304" stroke="#CBD5E1" stroke-width="5" stroke-dasharray="8 8" stroke-linecap="round"/>
  <path d="M818 286 L838 322 M838 286 L818 322" stroke="#D25D5A" stroke-width="5" stroke-linecap="round"/>
  <text x="826" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#8C3432">引用已断开</text>

  <polyline points="778,468 854,468 854,382 894,382" fill="none" stroke="#8569CB" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" stroke-linejoin="round" opacity="0.60"/>
  <polygon points="894,382 880,374 880,390" fill="#8569CB" opacity="0.60"/>
  <text x="817" y="452" text-anchor="middle" font-size="13" font-weight="700" fill="#5D469C">仍是弱关联</text>

  <!-- panel 1 nodes -->
  <g filter="url(#shadow)">
    <rect x="106" y="268" width="92" height="92" rx="46" fill="#FFFFFF" stroke="#5178C6" stroke-width="3"/>
    <circle cx="152" cy="299" r="14" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
    <path d="M128 340 C132 318 172 318 176 340" fill="none" stroke="#5178C6" stroke-width="3" stroke-linecap="round"/>
    <text x="152" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#315EA8">应用根</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="324" y="260" width="232" height="122" rx="24" fill="#FFFFFF" stroke="#509863" stroke-width="3"/>
    <rect x="358" y="288" width="62" height="52" rx="8" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
    <path d="M370 304 L408 304 M370 316 L398 316 M370 328 L402 328" stroke="#509863" stroke-width="2" stroke-linecap="round"/>
    <text x="452" y="304" font-size="18" font-weight="700" fill="#245C33">DOM element</text>
    <text x="452" y="332" font-size="13" fill="#64748B">WeakMap 的 key</text>
    <text x="452" y="356" font-size="13" fill="#64748B">key 仍可达</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="106" y="424" width="92" height="92" rx="20" fill="#FFFFFF" stroke="#8569CB" stroke-width="3"/>
    <path d="M128 452 L176 452 L176 488 L128 488 Z M136 444 L168 444" fill="none" stroke="#8569CB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="152" y="538" text-anchor="middle" font-size="14" font-weight="700" fill="#5D469C">WeakMap</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="324" y="424" width="232" height="104" rx="24" fill="#FFFFFF" stroke="#D4B45B" stroke-width="3"/>
    <text x="440" y="460" text-anchor="middle" font-size="18" font-weight="700" fill="#7C641E">metadata</text>
    <text x="440" y="488" text-anchor="middle" font-size="13" fill="#64748B">{ open: false }</text>
    <text x="440" y="512" text-anchor="middle" font-size="12" fill="#64748B">值可由 key 查询</text>
  </g>

  <!-- panel 2 nodes -->
  <g filter="url(#shadow)">
    <rect x="692" y="258" width="86" height="86" rx="43" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <circle cx="735" cy="287" r="13" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <path d="M713 328 C717 307 753 307 757 328" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <text x="735" y="368" text-anchor="middle" font-size="13" fill="#64748B">应用根</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="894" y="260" width="232" height="122" rx="24" fill="#FFFFFF" stroke="#D25D5A" stroke-width="3" stroke-dasharray="9 7"/>
    <rect x="928" y="288" width="62" height="52" rx="8" fill="#FEE3E2" stroke="#D25D5A" stroke-width="2"/>
    <path d="M940 304 L978 304 M940 316 L968 316 M940 328 L972 328" stroke="#D25D5A" stroke-width="2" stroke-linecap="round"/>
    <text x="1022" y="304" font-size="18" font-weight="700" fill="#8C3432">DOM element</text>
    <text x="1022" y="332" font-size="13" fill="#64748B">无强引用路径</text>
    <text x="1022" y="356" font-size="13" fill="#8C3432">可被 GC 回收</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="692" y="424" width="86" height="86" rx="20" fill="#FFFFFF" stroke="#8569CB" stroke-width="3"/>
    <path d="M713 450 L757 450 L757 484 L713 484 Z M721 442 L749 442" fill="none" stroke="#8569CB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="735" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#5D469C">WeakMap</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="894" y="424" width="232" height="104" rx="24" fill="#FFFFFF" stroke="#D25D5A" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="1010" y="460" text-anchor="middle" font-size="18" font-weight="700" fill="#8C3432">关联记录</text>
    <text x="1010" y="488" text-anchor="middle" font-size="13" fill="#64748B">无其他强引用时</text>
    <text x="1010" y="512" text-anchor="middle" font-size="13" fill="#8C3432">value 也可被回收</text>
  </g>

  <!-- bottom facts -->
  <rect x="70" y="616" width="1140" height="62" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <circle cx="112" cy="647" r="16" fill="#509863"/>
  <path d="M104 647 L110 653 L121 641" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="142" y="652" font-size="14" fill="#245C33">有效键：对象或非注册 Symbol</text>
  <line x1="466" y1="632" x2="466" y2="662" stroke="#CBD5E1" stroke-width="2"/>
  <text x="500" y="652" font-size="14" fill="#5D469C">无 size / 遍历器 / clear()</text>
  <line x1="804" y1="632" x2="804" y2="662" stroke="#CBD5E1" stroke-width="2"/>
  <text x="838" y="652" font-size="14" fill="#8C3432">“弱”不等于立即删除，也不等于可观测 GC</text>
</svg>
