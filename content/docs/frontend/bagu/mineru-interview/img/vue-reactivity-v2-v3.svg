<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="compare-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F0F4FC"/>
    </linearGradient>
    <filter id="compare-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1F2329" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#compare-bg)"/>
  <circle cx="90" cy="620" r="85" fill="#EAE2FE" opacity="0.55"/>
  <circle cx="1120" cy="90" r="70" fill="#DFF5E5" opacity="0.65"/>
  <text x="60" y="62" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#1F2329">Vue 2 defineProperty 与 Vue 3 Proxy 响应式对比</text>
  <text x="60" y="94" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#646A73">两者都需要 track / trigger 思想，差异在可拦截范围与初始化策略</text>

  <rect x="60" y="135" width="515" height="495" rx="25" fill="#FFFFFF" stroke="#8569CB" stroke-width="2" filter="url(#compare-shadow)"/>
  <rect x="625" y="135" width="515" height="495" rx="25" fill="#FFFFFF" stroke="#509863" stroke-width="2" filter="url(#compare-shadow)"/>

  <rect x="88" y="158" width="180" height="42" rx="21" fill="#8569CB"/>
  <text x="178" y="185" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Vue 2：逐属性拦截</text>
  <rect x="653" y="158" width="180" height="42" rx="21" fill="#509863"/>
  <text x="743" y="185" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Vue 3：对象代理</text>

  <rect x="92" y="230" width="184" height="92" rx="17" fill="#EAE2FE" stroke="#8569CB" stroke-width="2"/>
  <text x="184" y="258" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">初始化遍历</text>
  <text x="184" y="284" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">已有 key 全部转换</text>
  <text x="184" y="306" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">嵌套对象递归 observe</text>

  <polyline points="276,276 330,276" fill="none" stroke="#BBBFC4" stroke-width="4"/>
  <polygon points="346,276 325,265 325,287" fill="#BBBFC4"/>
  <rect x="346" y="230" width="184" height="92" rx="17" fill="#FFFFFF" stroke="#8569CB" stroke-width="2"/>
  <text x="438" y="258" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">getter / setter</text>
  <text x="438" y="284" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">读取收集依赖</text>
  <text x="438" y="306" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">写入通知更新</text>

  <rect x="92" y="354" width="438" height="112" rx="18" fill="#FEE3E2" stroke="#D25D5A" stroke-width="2"/>
  <text x="118" y="384" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">无法直接检测</text>
  <text x="118" y="412" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">• 对象新增 / 删除属性</text>
  <text x="320" y="412" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">• 数组索引 / length 赋值</text>
  <text x="118" y="440" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">补丁：Vue.set / Vue.delete + 改写数组变更方法</text>

  <rect x="92" y="500" width="438" height="92" rx="18" fill="#FEF1CE" stroke="#D4B45B" stroke-width="2"/>
  <text x="311" y="530" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">优势：可兼容更旧浏览器</text>
  <text x="311" y="558" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">代价：API 补丁与初始化遍历成本</text>

  <rect x="657" y="230" width="184" height="92" rx="17" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
  <text x="749" y="258" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">创建 Proxy</text>
  <text x="749" y="284" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">代理目标对象</text>
  <text x="749" y="306" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">WeakMap 缓存映射</text>

  <polyline points="841,276 895,276" fill="none" stroke="#BBBFC4" stroke-width="4"/>
  <polygon points="911,276 890,265 890,287" fill="#BBBFC4"/>
  <rect x="911" y="230" width="184" height="92" rx="17" fill="#FFFFFF" stroke="#509863" stroke-width="2"/>
  <text x="1003" y="258" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">Proxy traps</text>
  <text x="1003" y="284" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">get / set / delete</text>
  <text x="1003" y="306" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">has / ownKeys 等</text>

  <rect x="657" y="354" width="438" height="112" rx="18" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
  <text x="683" y="384" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">覆盖更多操作</text>
  <text x="683" y="412" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">• 新增、删除、in、键枚举</text>
  <text x="901" y="412" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">• 数组索引与 length</text>
  <text x="683" y="440" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">嵌套对象在 getter 访问时按需转为响应式代理</text>

  <rect x="657" y="500" width="438" height="92" rx="18" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
  <text x="876" y="530" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">优势：拦截完整、嵌套懒转换</text>
  <text x="876" y="558" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">代价：返回新对象，不支持 IE，无法完整 polyfill</text>

  <rect x="190" y="650" width="820" height="34" rx="17" fill="#1F2329"/>
  <text x="600" y="673" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Proxy 只是拦截基础；Vue 3 仍需 track、trigger、effect 与调度器组成完整响应式系统</text>
</svg>
