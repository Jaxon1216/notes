<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="diff-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="diff-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="diff-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#64748B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#diff-bg)"/>
  <text x="60" y="66" fill="url(#diff-title)" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700">React 调和：type + key 决定身份与状态归属</text>
  <text x="60" y="102" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="15">比较发生在同一父级的兄弟集合；React 不追踪任意跨父级移动</text>

  <g filter="url(#diff-shadow)">
    <rect x="48" y="140" width="1104" height="178" rx="24" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <text x="78" y="176" fill="#CBD5E1" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700">旧兄弟列表</text>
    <text x="78" y="274" fill="#CBD5E1" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700">新兄弟列表</text>

    <rect x="238" y="158" width="176" height="52" rx="14" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
    <text x="326" y="190" text-anchor="middle" fill="#1E3A8A" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">Row · key="a"</text>
    <rect x="446" y="158" width="176" height="52" rx="14" fill="#EAE2FE" stroke="#8569CB" stroke-width="2"/>
    <text x="534" y="190" text-anchor="middle" fill="#4C1D95" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">Row · key="b"</text>
    <rect x="654" y="158" width="176" height="52" rx="14" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
    <text x="742" y="190" text-anchor="middle" fill="#14532D" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">Row · key="c"</text>

    <rect x="238" y="250" width="176" height="52" rx="14" fill="#EAE2FE" stroke="#8569CB" stroke-width="2"/>
    <text x="326" y="282" text-anchor="middle" fill="#4C1D95" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">Row · key="b"</text>
    <rect x="446" y="250" width="176" height="52" rx="14" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
    <text x="534" y="282" text-anchor="middle" fill="#1E3A8A" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">Row · key="a"</text>
    <rect x="654" y="250" width="176" height="52" rx="14" fill="#FEE3E2" stroke="#D25D5A" stroke-width="2"/>
    <text x="742" y="282" text-anchor="middle" fill="#7F1D1D" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">Row · key="d"</text>

    <path d="M326 214 C326 232 534 232 534 246" fill="none" stroke="#60A5FA" stroke-width="3"/>
    <polygon points="534,250 528,238 540,238" fill="#60A5FA"/>
    <path d="M534 214 C534 232 326 232 326 246" fill="none" stroke="#A78BFA" stroke-width="3"/>
    <polygon points="326,250 320,238 332,238" fill="#A78BFA"/>
    <line x1="742" y1="214" x2="742" y2="236" stroke="#EF4444" stroke-width="3"/>
    <line x1="730" y1="225" x2="754" y2="225" stroke="#EF4444" stroke-width="3"/>

    <rect x="870" y="170" width="238" height="118" rx="18" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <text x="989" y="201" text-anchor="middle" fill="#F8FAFC" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">结果</text>
    <text x="894" y="228" fill="#93C5FD" font-family="Noto Sans SC, sans-serif" font-size="13">a、b：复用并移动</text>
    <text x="894" y="253" fill="#FCA5A5" font-family="Noto Sans SC, sans-serif" font-size="13">c：删除</text>
    <text x="894" y="278" fill="#FDE68A" font-family="Noto Sans SC, sans-serif" font-size="13">d：新建</text>
  </g>

  <g filter="url(#diff-shadow)">
    <rect x="48" y="352" width="1104" height="292" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="78" y="390" fill="#1F2329" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700">单个位置的身份决策</text>

    <rect x="80" y="430" width="190" height="70" rx="18" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <text x="175" y="460" text-anchor="middle" fill="#F8FAFC" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700">新元素到达</text>
    <text x="175" y="482" text-anchor="middle" fill="#94A3B8" font-family="Noto Sans SC, sans-serif" font-size="12">在同一父级查找旧 Fiber</text>

    <polyline points="270,465 322,465" fill="none" stroke="#94A3B8" stroke-width="4"/>
    <polygon points="334,465 320,458 320,472" fill="#94A3B8"/>

    <polygon points="426,404 520,465 426,526 332,465" fill="#FEF1CE" stroke="#D4B45B" stroke-width="3"/>
    <text x="426" y="458" text-anchor="middle" fill="#1F2329" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">type 相同？</text>
    <text x="426" y="480" text-anchor="middle" fill="#92400E" font-family="Noto Sans SC, sans-serif" font-size="12">宿主类型 / 组件类型</text>

    <polyline points="520,465 564,465" fill="none" stroke="#509863" stroke-width="4"/>
    <polygon points="576,465 562,458 562,472" fill="#509863"/>
    <text x="544" y="450" text-anchor="middle" fill="#15803D" font-family="Noto Sans SC, sans-serif" font-size="12">是</text>

    <polygon points="668,404 762,465 668,526 574,465" fill="#EAE2FE" stroke="#8569CB" stroke-width="3"/>
    <text x="668" y="458" text-anchor="middle" fill="#1F2329" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">key 相同？</text>
    <text x="668" y="480" text-anchor="middle" fill="#6D28D9" font-family="Noto Sans SC, sans-serif" font-size="12">无 key 时按位置</text>

    <polyline points="762,465 806,465" fill="none" stroke="#509863" stroke-width="4"/>
    <polygon points="818,465 804,458 804,472" fill="#509863"/>
    <text x="786" y="450" text-anchor="middle" fill="#15803D" font-family="Noto Sans SC, sans-serif" font-size="12">是</text>

    <rect x="818" y="420" width="286" height="90" rx="18" fill="#DFF5E5" stroke="#509863" stroke-width="3"/>
    <text x="961" y="454" text-anchor="middle" fill="#14532D" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700">复用 Fiber、DOM 与状态</text>
    <text x="961" y="480" text-anchor="middle" fill="#166534" font-family="Noto Sans SC, sans-serif" font-size="13">更新 props，继续比较子节点</text>

    <polyline points="426,526 426,568 540,568" fill="none" stroke="#D25D5A" stroke-width="4"/>
    <text x="450" y="555" fill="#B91C1C" font-family="Noto Sans SC, sans-serif" font-size="12">否</text>
    <polyline points="668,526 668,568 620,568" fill="none" stroke="#D25D5A" stroke-width="4"/>
    <text x="680" y="555" fill="#B91C1C" font-family="Noto Sans SC, sans-serif" font-size="12">否</text>

    <rect x="540" y="540" width="286" height="78" rx="18" fill="#FEE3E2" stroke="#D25D5A" stroke-width="3"/>
    <text x="683" y="571" text-anchor="middle" fill="#7F1D1D" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700">卸载旧子树，挂载新子树</text>
    <text x="683" y="596" text-anchor="middle" fill="#991B1B" font-family="Noto Sans SC, sans-serif" font-size="13">组件 state 随身份改变而重置</text>
  </g>

  <rect x="858" y="550" width="246" height="58" rx="18" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="981" y="575" text-anchor="middle" fill="#334155" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700">稳定 key 的首要价值</text>
  <text x="981" y="596" text-anchor="middle" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="12">身份正确，而非单纯“更快”</text>
</svg>
