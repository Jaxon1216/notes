<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="grid-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#FFFDF5"/>
    </linearGradient>
    <filter id="grid-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1F2329" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="760" rx="28" fill="url(#grid-bg)"/>
  <circle cx="1110" cy="94" r="48" fill="#FEF1CE"/>
  <path d="M 1078 94 H 1142 M 1110 62 V 126" fill="none" stroke="#D4B45B" stroke-width="4"/>

  <text x="58" y="66" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#1F2329">CSS Grid：线定义边界，轨道承载布局</text>
  <text x="58" y="102" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#646A73">网格项按单元格自动放置，也可以跨越多条线形成区域</text>

  <g filter="url(#grid-shadow)">
    <rect x="58" y="144" width="704" height="540" rx="24" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="2"/>
  </g>
  <text x="90" y="188" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#1F2329">2 行 × 3 列的显式网格</text>

  <rect x="112" y="246" width="570" height="330" rx="10" fill="#F8FAFC" stroke="#5178C6" stroke-width="3"/>

  <rect x="114" y="248" width="188" height="163" fill="#F0F4FC"/>
  <rect x="304" y="248" width="188" height="163" fill="#EAE2FE"/>
  <rect x="494" y="248" width="186" height="163" fill="#DFF5E5"/>
  <rect x="114" y="413" width="188" height="161" fill="#FEF1CE"/>
  <rect x="304" y="413" width="376" height="161" rx="6" fill="#FEE3E2"/>

  <path d="M 112 246 V 576 M 302 246 V 576 M 492 246 V 576 M 682 246 V 576" fill="none" stroke="#5178C6" stroke-width="3"/>
  <path d="M 112 246 H 682 M 112 411 H 682 M 112 576 H 682" fill="none" stroke="#5178C6" stroke-width="3"/>

  <g font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#5178C6" text-anchor="middle">
    <text x="112" y="226">1</text>
    <text x="302" y="226">2</text>
    <text x="492" y="226">3</text>
    <text x="682" y="226">4</text>
  </g>
  <g font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#5178C6" text-anchor="end">
    <text x="94" y="251">1</text>
    <text x="94" y="416">2</text>
    <text x="94" y="581">3</text>
  </g>

  <g font-family="Noto Sans SC, sans-serif" fill="#1F2329" text-anchor="middle">
    <text x="208" y="325" font-size="18" font-weight="700">单元格</text>
    <text x="208" y="351" font-size="13" fill="#646A73">1 行 × 1 列</text>
    <text x="398" y="325" font-size="18" font-weight="700">列轨道</text>
    <text x="398" y="351" font-size="13" fill="#646A73">两条垂直线之间</text>
    <text x="588" y="325" font-size="18" font-weight="700">网格项</text>
    <text x="588" y="351" font-size="13" fill="#646A73">自动进入单元格</text>
    <text x="208" y="491" font-size="18" font-weight="700">行轨道</text>
    <text x="208" y="517" font-size="13" fill="#646A73">两条水平线之间</text>
    <text x="492" y="482" font-size="19" font-weight="700">跨列网格区域</text>
    <text x="492" y="512" font-size="14" fill="#646A73">grid-column: 2 / 4</text>
  </g>

  <path d="M 112 614 H 682" fill="none" stroke="#8569CB" stroke-width="3"/>
  <polygon points="112,614 126,607 126,621" fill="#8569CB"/>
  <polygon points="682,614 668,607 668,621" fill="#8569CB"/>
  <text x="397" y="643" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#6B51AF">3 个列轨道，共 4 条垂直网格线</text>

  <g filter="url(#grid-shadow)">
    <rect x="802" y="144" width="340" height="540" rx="24" fill="#1F2329"/>
  </g>
  <text x="838" y="190" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">从声明到放置</text>

  <rect x="834" y="222" width="276" height="112" rx="14" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
  <text x="858" y="254" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">1. 定义列轨道</text>
  <text x="858" y="284" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">200px minmax(0, 1fr) 2fr</text>
  <text x="858" y="308" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">fr 分配扣除固定尺寸后的空间</text>

  <path d="M 972 336 V 366" fill="none" stroke="#BBBFC4" stroke-width="3"/>
  <polygon points="972,374 964,360 980,360" fill="#BBBFC4"/>

  <rect x="834" y="382" width="276" height="106" rx="14" fill="#EAE2FE" stroke="#8569CB" stroke-width="2"/>
  <text x="858" y="414" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">2. 自动放置项目</text>
  <text x="858" y="444" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">grid-auto-flow 默认按行填充</text>
  <text x="858" y="468" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">超出显式网格会生成隐式轨道</text>

  <path d="M 972 490 V 520" fill="none" stroke="#BBBFC4" stroke-width="3"/>
  <polygon points="972,528 964,514 980,514" fill="#BBBFC4"/>

  <rect x="834" y="536" width="276" height="108" rx="14" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
  <text x="858" y="568" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">3. 按线或区域定位</text>
  <text x="858" y="598" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">grid-column / grid-row</text>
  <text x="858" y="622" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">或 grid-template-areas + grid-area</text>

  <rect x="384" y="706" width="432" height="36" rx="18" fill="#5178C6"/>
  <text x="600" y="730" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Grid 管二维结构；Flex 管一维内容流</text>
</svg>
