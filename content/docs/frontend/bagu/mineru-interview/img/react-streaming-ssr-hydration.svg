<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="ssr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="ssr-server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="ssr-browser" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065F46"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="ssr-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#64748B" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#ssr-bg)"/>
  <text x="60" y="66" fill="#0F172A" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700">流式 SSR：先到达 HTML，再完成水合交互</text>
  <text x="60" y="102" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="15">Suspense 允许 shell 先展示，慢内容随后分块补齐</text>

  <g filter="url(#ssr-shadow)">
    <rect x="54" y="148" width="318" height="440" rx="26" fill="url(#ssr-server)"/>
    <circle cx="100" cy="194" r="25" fill="#FFFFFF" opacity="0.16"/>
    <rect x="88" y="184" width="24" height="22" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="94" y1="191" x2="106" y2="191" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="94" y1="198" x2="106" y2="198" stroke="#FFFFFF" stroke-width="2"/>
    <text x="138" y="201" fill="#FFFFFF" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="700">Node / Edge 服务端</text>

    <rect x="84" y="244" width="258" height="66" rx="16" fill="#FFFFFF" opacity="0.94"/>
    <text x="213" y="272" text-anchor="middle" fill="#1E3A8A" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">1. 路由匹配 + 数据准备</text>
    <text x="213" y="294" text-anchor="middle" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="12">保持与客户端初始快照一致</text>

    <rect x="84" y="334" width="258" height="76" rx="16" fill="#FFFFFF" opacity="0.94"/>
    <text x="213" y="362" text-anchor="middle" fill="#4C1D95" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">2. renderToPipeableStream</text>
    <text x="213" y="384" text-anchor="middle" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="12">renderToReadableStream（Edge）</text>
    <text x="213" y="402" text-anchor="middle" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="12">生成可渐进发送的 HTML</text>

    <rect x="84" y="434" width="258" height="122" rx="16" fill="#111C31" stroke="#A78BFA" stroke-width="2"/>
    <text x="106" y="465" fill="#F8FAFC" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">Suspense 边界</text>
    <rect x="106" y="482" width="102" height="48" rx="10" fill="#FEF1CE" stroke="#D4B45B" stroke-width="2"/>
    <text x="157" y="512" text-anchor="middle" fill="#92400E" font-family="Noto Sans SC, sans-serif" font-size="12">fallback</text>
    <rect x="220" y="482" width="100" height="48" rx="10" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
    <text x="270" y="512" text-anchor="middle" fill="#14532D" font-family="Noto Sans SC, sans-serif" font-size="12">真实内容</text>
  </g>

  <polyline points="372,366 418,366" fill="none" stroke="#7C3AED" stroke-width="5"/>
  <polygon points="432,366 416,358 416,374" fill="#7C3AED"/>

  <g filter="url(#ssr-shadow)">
    <rect x="432" y="180" width="330" height="376" rx="24" fill="#FFFFFF" stroke="#8569CB" stroke-width="2"/>
    <text x="462" y="220" fill="#4C1D95" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700">HTTP 流：边生成边发送</text>
    <line x1="478" y1="270" x2="716" y2="270" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>

    <circle cx="492" cy="270" r="13" fill="#2563EB"/>
    <text x="492" y="275" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans SC, sans-serif" font-size="10" font-weight="700">1</text>
    <rect x="466" y="302" width="102" height="82" rx="14" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
    <text x="517" y="329" text-anchor="middle" fill="#1E3A8A" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700">HTML shell</text>
    <text x="517" y="352" text-anchor="middle" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="11">布局 + 首屏</text>
    <text x="517" y="372" text-anchor="middle" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="11">fallback</text>

    <circle cx="596" cy="270" r="13" fill="#D4B45B"/>
    <text x="596" y="275" text-anchor="middle" fill="#1F2329" font-family="Noto Sans SC, sans-serif" font-size="10" font-weight="700">2</text>
    <rect x="545" y="410" width="102" height="82" rx="14" fill="#FEF1CE" stroke="#D4B45B" stroke-width="2"/>
    <text x="596" y="437" text-anchor="middle" fill="#92400E" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700">慢内容块</text>
    <text x="596" y="460" text-anchor="middle" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="11">数据就绪后</text>
    <text x="596" y="480" text-anchor="middle" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="11">替换 fallback</text>

    <circle cx="700" cy="270" r="13" fill="#509863"/>
    <text x="700" y="275" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans SC, sans-serif" font-size="10" font-weight="700">3</text>
    <rect x="624" y="302" width="112" height="82" rx="14" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
    <text x="680" y="329" text-anchor="middle" fill="#14532D" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700">bootstrap JS</text>
    <text x="680" y="352" text-anchor="middle" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="11">加载客户端包</text>
    <text x="680" y="372" text-anchor="middle" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="11">准备水合</text>

    <text x="597" y="530" text-anchor="middle" fill="#8569CB" font-family="Noto Sans SC, sans-serif" font-size="12">页面无需等待所有数据完成才开始显示</text>
  </g>

  <polyline points="762,366 808,366" fill="none" stroke="#10B981" stroke-width="5"/>
  <polygon points="822,366 806,358 806,374" fill="#10B981"/>

  <g filter="url(#ssr-shadow)">
    <rect x="822" y="148" width="324" height="440" rx="26" fill="url(#ssr-browser)"/>
    <circle cx="868" cy="194" r="25" fill="#FFFFFF" opacity="0.16"/>
    <rect x="854" y="181" width="28" height="24" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="854" y1="189" x2="882" y2="189" stroke="#FFFFFF" stroke-width="2"/>
    <text x="906" y="201" fill="#FFFFFF" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="700">浏览器</text>

    <rect x="852" y="244" width="264" height="66" rx="16" fill="#FFFFFF" opacity="0.95"/>
    <text x="984" y="272" text-anchor="middle" fill="#065F46" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">3. 解析 HTML，尽早展示</text>
    <text x="984" y="294" text-anchor="middle" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="12">此时内容可见但未必可交互</text>

    <rect x="852" y="334" width="264" height="76" rx="16" fill="#FFFFFF" opacity="0.95"/>
    <text x="984" y="362" text-anchor="middle" fill="#065F46" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700">4. 加载客户端 JavaScript</text>
    <text x="984" y="386" text-anchor="middle" fill="#64748B" font-family="Noto Sans SC, sans-serif" font-size="12">构建同一初始 React 树</text>

    <rect x="852" y="434" width="264" height="94" rx="16" fill="#DFF5E5" stroke="#34D399" stroke-width="3"/>
    <text x="984" y="466" text-anchor="middle" fill="#064E3B" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700">5. hydrateRoot</text>
    <text x="984" y="491" text-anchor="middle" fill="#065F46" font-family="Noto Sans SC, sans-serif" font-size="12">复用 DOM，附加事件与状态</text>
    <text x="984" y="512" text-anchor="middle" fill="#047857" font-family="Noto Sans SC, sans-serif" font-size="12">页面变为可交互</text>
  </g>

  <g filter="url(#ssr-shadow)">
    <rect x="122" y="622" width="956" height="54" rx="20" fill="#FFFFFF" stroke="#D25D5A" stroke-width="2"/>
    <text x="150" y="655" fill="#7F1D1D" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700">水合前提：</text>
    <text x="232" y="655" fill="#475569" font-family="Noto Sans SC, sans-serif" font-size="13">服务端与客户端首次输出一致；随机数、时间、环境分支和数据快照差异都可能造成 mismatch。</text>
  </g>
</svg>
