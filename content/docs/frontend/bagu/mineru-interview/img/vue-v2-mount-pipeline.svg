<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="mount-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EAE2FE"/>
    </linearGradient>
    <filter id="mount-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1F2329" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#mount-bg)"/>
  <circle cx="90" cy="625" r="86" fill="#DFF5E5" opacity="0.7"/>
  <circle cx="1125" cy="95" r="70" fill="#FEF1CE" opacity="0.75"/>
  <text x="60" y="62" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#1F2329">Vue 2 实例初始化与挂载主链路</text>
  <text x="60" y="94" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#646A73">从 new Vue() 到渲染 Watcher，再到首次 DOM patch</text>

  <path d="M155 330 C240 220 350 220 430 330 S620 440 710 330 S900 220 1035 330" fill="none" stroke="#BBBFC4" stroke-width="8" stroke-linecap="round"/>
  <polygon points="1055,330 1028,315 1028,345" fill="#BBBFC4"/>

  <ellipse cx="145" cy="330" rx="82" ry="54" fill="#1F2329" filter="url(#mount-shadow)"/>
  <text x="145" y="323" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">new Vue()</text>
  <text x="145" y="347" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#FFFFFF">调用 _init</text>

  <rect x="260" y="145" width="240" height="152" rx="22" fill="#F0F4FC" stroke="#5178C6" stroke-width="2" filter="url(#mount-shadow)"/>
  <rect x="282" y="164" width="196" height="32" rx="16" fill="#5178C6"/>
  <text x="380" y="186" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">实例初始化</text>
  <text x="285" y="224" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">1. 合并 options</text>
  <text x="285" y="248" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">2. lifecycle / events / render</text>
  <text x="285" y="272" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">3. beforeCreate</text>

  <rect x="260" y="365" width="240" height="152" rx="22" fill="#EAE2FE" stroke="#8569CB" stroke-width="2" filter="url(#mount-shadow)"/>
  <rect x="282" y="384" width="196" height="32" rx="16" fill="#8569CB"/>
  <text x="380" y="406" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">状态建立</text>
  <text x="285" y="444" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">4. injections → state</text>
  <text x="285" y="468" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">5. provide → created</text>
  <text x="285" y="492" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">6. data 完成响应式处理</text>

  <circle cx="380" cy="330" r="18" fill="#FFFFFF" stroke="#BBBFC4" stroke-width="4"/>
  <line x1="380" y1="297" x2="380" y2="312" stroke="#BBBFC4" stroke-width="4"/>
  <line x1="380" y1="348" x2="380" y2="365" stroke="#BBBFC4" stroke-width="4"/>

  <rect x="535" y="220" width="190" height="220" rx="26" fill="#FFFFFF" stroke="#D4B45B" stroke-width="2" filter="url(#mount-shadow)"/>
  <path d="M570 264 H690 L675 287 H585 Z" fill="#FEF1CE" stroke="#D4B45B" stroke-width="2"/>
  <text x="630" y="281" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">$mount</text>
  <text x="630" y="322" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">已有 render?</text>
  <polygon points="630,340 675,372 630,404 585,372" fill="#FFFFFF" stroke="#D4B45B" stroke-width="2"/>
  <text x="630" y="378" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#1F2329">判断</text>
  <text x="552" y="416" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#646A73">无 render：编译模板</text>
  <text x="552" y="436" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#646A73">有 render：直接使用</text>

  <rect x="760" y="145" width="200" height="152" rx="22" fill="#DFF5E5" stroke="#509863" stroke-width="2" filter="url(#mount-shadow)"/>
  <rect x="780" y="164" width="160" height="32" rx="16" fill="#509863"/>
  <text x="860" y="186" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">mountComponent</text>
  <text x="785" y="224" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">beforeMount</text>
  <text x="785" y="248" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">定义 updateComponent</text>
  <text x="785" y="272" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">创建渲染 Watcher</text>

  <rect x="760" y="365" width="200" height="152" rx="22" fill="#FEE3E2" stroke="#D25D5A" stroke-width="2" filter="url(#mount-shadow)"/>
  <rect x="780" y="384" width="160" height="32" rx="16" fill="#D25D5A"/>
  <text x="860" y="406" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">首次渲染</text>
  <text x="785" y="444" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">_render() → VNode</text>
  <text x="785" y="468" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">_update() → __patch__</text>
  <text x="785" y="492" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">真实 DOM + mounted</text>

  <circle cx="860" cy="330" r="18" fill="#FFFFFF" stroke="#BBBFC4" stroke-width="4"/>
  <line x1="860" y1="297" x2="860" y2="312" stroke="#BBBFC4" stroke-width="4"/>
  <line x1="860" y1="348" x2="860" y2="365" stroke="#BBBFC4" stroke-width="4"/>

  <ellipse cx="1060" cy="330" rx="82" ry="54" fill="#509863" filter="url(#mount-shadow)"/>
  <text x="1060" y="323" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">页面可见</text>
  <text x="1060" y="347" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#FFFFFF">依赖已收集</text>

  <rect x="174" y="570" width="852" height="70" rx="18" fill="#1F2329"/>
  <text x="600" y="597" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">后续状态变化：Watcher 入队 → 重新 _render → Diff → _update patch</text>
  <text x="600" y="623" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#FFFFFF">单文件组件通常已在构建阶段预编译，不会在浏览器里重复编译模板</text>
</svg>
