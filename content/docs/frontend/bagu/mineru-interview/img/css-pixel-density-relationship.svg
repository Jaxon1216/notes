<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <defs>
    <linearGradient id="pixel-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#FFF9F8"/>
    </linearGradient>
    <filter id="pixel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#1F2329" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="740" rx="28" fill="url(#pixel-bg)"/>
  <text x="58" y="66" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#1F2329">从 CSS 坐标到屏幕发光点：DPR 是映射比例</text>
  <text x="58" y="102" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#646A73">CSS px 负责网页布局；设备像素负责最终显示；PPI 描述硬件密度而不是页面缩放</text>

  <g filter="url(#pixel-shadow)">
    <rect x="58" y="148" width="1084" height="184" rx="24" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="2"/>
  </g>
  <text x="92" y="190" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#1F2329">逻辑坐标链路</text>

  <rect x="92" y="220" width="244" height="78" rx="14" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
  <text x="214" y="251" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#1F2329">平台逻辑坐标（DIP）</text>
  <text x="214" y="278" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">映射关系随平台与缩放而异</text>

  <path d="M 344 259 H 430" fill="none" stroke="#BBBFC4" stroke-width="3"/>
  <polygon points="442,259 424,250 424,268" fill="#BBBFC4"/>

  <rect x="450" y="220" width="244" height="78" rx="14" fill="#EAE2FE" stroke="#8569CB" stroke-width="2"/>
  <text x="572" y="251" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#1F2329">CSS 像素（px）</text>
  <text x="572" y="278" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">布局与媒体查询的参考长度</text>

  <path d="M 702 259 H 788" fill="none" stroke="#BBBFC4" stroke-width="3"/>
  <polygon points="800,259 782,250 782,268" fill="#BBBFC4"/>
  <text x="751" y="241" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#D25D5A">× DPR</text>

  <rect x="808" y="220" width="300" height="78" rx="14" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
  <text x="958" y="251" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#1F2329">设备像素（physical pixel）</text>
  <text x="958" y="278" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">面板最终寻址的图像单元</text>

  <g filter="url(#pixel-shadow)">
    <rect x="58" y="370" width="760" height="300" rx="24" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
  </g>
  <text x="92" y="414" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#1F2329">同一个 1px × 1px CSS 区域</text>

  <g transform="translate(104 460)">
    <rect x="0" y="0" width="136" height="136" rx="16" fill="#FFFFFF" stroke="#5178C6" stroke-width="2"/>
    <rect x="34" y="34" width="68" height="68" rx="4" fill="#5178C6"/>
    <text x="68" y="164" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">DPR = 1</text>
    <text x="68" y="188" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">1 × 1 设备像素</text>
  </g>

  <g transform="translate(326 460)">
    <rect x="0" y="0" width="136" height="136" rx="16" fill="#FFFFFF" stroke="#8569CB" stroke-width="2"/>
    <rect x="26" y="26" width="42" height="42" fill="#8569CB" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="68" y="26" width="42" height="42" fill="#8569CB" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="26" y="68" width="42" height="42" fill="#8569CB" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="68" y="68" width="42" height="42" fill="#8569CB" stroke="#FFFFFF" stroke-width="2"/>
    <text x="68" y="164" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">DPR = 2</text>
    <text x="68" y="188" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">2 × 2 设备像素</text>
  </g>

  <g transform="translate(548 460)">
    <rect x="0" y="0" width="136" height="136" rx="16" fill="#FFFFFF" stroke="#509863" stroke-width="2"/>
    <g fill="#509863" stroke="#FFFFFF" stroke-width="2">
      <rect x="23" y="23" width="30" height="30"/>
      <rect x="53" y="23" width="30" height="30"/>
      <rect x="83" y="23" width="30" height="30"/>
      <rect x="23" y="53" width="30" height="30"/>
      <rect x="53" y="53" width="30" height="30"/>
      <rect x="83" y="53" width="30" height="30"/>
      <rect x="23" y="83" width="30" height="30"/>
      <rect x="53" y="83" width="30" height="30"/>
      <rect x="83" y="83" width="30" height="30"/>
    </g>
    <text x="68" y="164" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">DPR = 3</text>
    <text x="68" y="188" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">3 × 3 设备像素</text>
  </g>

  <rect x="714" y="460" width="72" height="136" rx="14" fill="#1F2329"/>
  <text x="750" y="502" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">DPR</text>
  <text x="750" y="530" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#FFFFFF">可为</text>
  <text x="750" y="554" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#FFFFFF">小数</text>
  <text x="750" y="580" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#FFFFFF">会随缩放变化</text>

  <g filter="url(#pixel-shadow)">
    <rect x="850" y="370" width="292" height="300" rx="24" fill="#FEF1CE" stroke="#D4B45B" stroke-width="2"/>
  </g>
  <text x="884" y="414" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#1F2329">PPI：硬件像素密度</text>

  <path d="M 906 472 L 1054 568" fill="none" stroke="#D4B45B" stroke-width="4"/>
  <rect x="906" y="458" width="148" height="110" rx="10" fill="#FFFFFF" stroke="#D4B45B" stroke-width="2"/>
  <path d="M 906 458 L 1054 568" fill="none" stroke="#D25D5A" stroke-width="3"/>
  <text x="930" y="492" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">水平像素 X</text>
  <text x="930" y="544" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">垂直像素 Y</text>
  <text x="1068" y="522" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#D25D5A">对角像素</text>

  <rect x="882" y="600" width="228" height="42" rx="10" fill="#FFFFFF" stroke="#D4B45B" stroke-width="2"/>
  <text x="996" y="626" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#1F2329">PPI = √(X² + Y²) / 英寸</text>

  <rect x="340" y="696" width="520" height="32" rx="16" fill="#1F2329"/>
  <text x="600" y="718" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">PPI 说明屏幕有多密；DPR 说明网页坐标如何映射到设备像素</text>
</svg>
