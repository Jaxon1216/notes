<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <rect x="10" y="10" width="1180" height="700" rx="28" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="2"/>
  <text x="600" y="48" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="26" font-weight="700" fill="#1F2329">TypeScript 装饰器：两套语义不能混用</text>
  <text x="600" y="74" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">先确认项目使用标准装饰器语义，还是 experimentalDecorators 的 legacy 语义</text>

  <rect x="420" y="102" width="360" height="76" rx="38" fill="#1F2329" stroke="#1F2329" stroke-width="2"/>
  <text x="600" y="133" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">@decorator expression</text>
  <text x="600" y="158" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#FFFFFF">类定义阶段求值并执行</text>

  <path d="M520 178 C462 214 380 220 310 251" fill="none" stroke="#BBBFC4" stroke-width="3"/>
  <polygon points="301,256 312,244 318,259" fill="#BBBFC4"/>
  <path d="M680 178 C738 214 820 220 890 251" fill="none" stroke="#BBBFC4" stroke-width="3"/>
  <polygon points="899,256 882,259 888,244" fill="#BBBFC4"/>

  <rect x="60" y="252" width="500" height="340" rx="24" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
  <rect x="90" y="276" width="190" height="38" rx="19" fill="#509863"/>
  <text x="185" y="301" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">标准装饰器语义</text>
  <text x="90" y="343" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">TypeScript 5.0+ 默认支持语法</text>

  <rect x="90" y="365" width="440" height="76" rx="14" fill="#FFFFFF" stroke="#509863" stroke-width="2"/>
  <text x="112" y="394" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">方法签名</text>
  <text x="112" y="420" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">(originalMethod, context) → replacement | void</text>

  <circle cx="112" cy="475" r="7" fill="#509863"/>
  <text x="132" y="481" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">context 提供 name / static / private 等信息</text>
  <circle cx="112" cy="513" r="7" fill="#509863"/>
  <text x="132" y="519" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">可返回替代实现，或调用 addInitializer</text>
  <circle cx="112" cy="551" r="7" fill="#509863"/>
  <text x="132" y="557" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">不支持参数装饰器和旧 emitDecoratorMetadata</text>

  <rect x="640" y="252" width="500" height="340" rx="24" fill="#EAE2FE" stroke="#8569CB" stroke-width="2"/>
  <rect x="670" y="276" width="190" height="38" rx="19" fill="#8569CB"/>
  <text x="765" y="301" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">legacy 装饰器</text>
  <text x="670" y="343" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">需要 experimentalDecorators</text>

  <rect x="670" y="365" width="440" height="76" rx="14" fill="#FFFFFF" stroke="#8569CB" stroke-width="2"/>
  <text x="692" y="394" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">方法签名</text>
  <text x="692" y="420" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">(target, propertyKey, descriptor) → descriptor | void</text>

  <circle cx="692" cy="475" r="7" fill="#8569CB"/>
  <text x="712" y="481" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">实例成员 target 通常是 prototype</text>
  <circle cx="692" cy="513" r="7" fill="#8569CB"/>
  <text x="712" y="519" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">通过属性描述符修改或替换方法</text>
  <circle cx="692" cy="551" r="7" fill="#8569CB"/>
  <text x="712" y="557" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">支持参数装饰器，可配合 emitDecoratorMetadata</text>

  <rect x="180" y="620" width="840" height="62" rx="18" fill="#FEE3E2" stroke="#D25D5A" stroke-width="2"/>
  <polygon points="220,638 238,668 202,668" fill="#D25D5A"/>
  <text x="220" y="662" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">!</text>
  <text x="260" y="647" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">迁移前先检查框架契约</text>
  <text x="260" y="670" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">旧装饰器函数通常不能直接用于标准语义；参数、返回值、初始化时机和元数据能力都不同</text>
</svg>
