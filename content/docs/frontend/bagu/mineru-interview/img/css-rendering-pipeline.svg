<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="render-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#FFFDF6"/>
    </linearGradient>
    <filter id="render-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#1F2329" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="760" rx="28" fill="url(#render-bg)"/>
  <text x="58" y="66" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#1F2329">浏览器渲染链路：一次变化不一定跑完整条流水线</text>
  <text x="58" y="102" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#646A73">几何变化通常从 Layout 开始；视觉变化可从 Paint 开始；合成友好属性可能只更新 Composite</text>

  <g filter="url(#render-shadow)">
    <rect x="48" y="146" width="1184" height="302" rx="24" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="2"/>
  </g>
  <text x="78" y="186" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#1F2329">主渲染流水线</text>

  <g font-family="Noto Sans SC, sans-serif" text-anchor="middle">
    <rect x="76" y="226" width="154" height="108" rx="18" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
    <text x="153" y="267" font-size="17" font-weight="700" fill="#1F2329">DOM + CSSOM</text>
    <text x="153" y="296" font-size="13" fill="#646A73">解析结构与样式规则</text>

    <rect x="274" y="226" width="154" height="108" rx="18" fill="#EAE2FE" stroke="#8569CB" stroke-width="2"/>
    <text x="351" y="267" font-size="17" font-weight="700" fill="#1F2329">Style</text>
    <text x="351" y="296" font-size="13" fill="#646A73">计算匹配后的样式</text>

    <rect x="472" y="226" width="154" height="108" rx="18" fill="#FEF1CE" stroke="#D4B45B" stroke-width="2"/>
    <text x="549" y="267" font-size="17" font-weight="700" fill="#1F2329">Layout</text>
    <text x="549" y="296" font-size="13" fill="#646A73">计算尺寸与位置</text>

    <rect x="670" y="226" width="154" height="108" rx="18" fill="#FEE3E2" stroke="#D25D5A" stroke-width="2"/>
    <text x="747" y="267" font-size="17" font-weight="700" fill="#1F2329">Paint</text>
    <text x="747" y="296" font-size="13" fill="#646A73">生成绘制指令</text>

    <rect x="868" y="226" width="154" height="108" rx="18" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
    <text x="945" y="267" font-size="17" font-weight="700" fill="#1F2329">Composite</text>
    <text x="945" y="296" font-size="13" fill="#646A73">组合与提交图层</text>

    <rect x="1066" y="226" width="138" height="108" rx="54" fill="#1F2329" stroke="#1F2329" stroke-width="2"/>
    <text x="1135" y="267" font-size="17" font-weight="700" fill="#FFFFFF">Display</text>
    <text x="1135" y="296" font-size="13" fill="#FFFFFF">呈现到屏幕</text>
  </g>

  <g fill="none" stroke="#BBBFC4" stroke-width="3">
    <path d="M 232 280 H 260"/>
    <path d="M 430 280 H 458"/>
    <path d="M 628 280 H 656"/>
    <path d="M 826 280 H 854"/>
    <path d="M 1024 280 H 1052"/>
  </g>
  <g fill="#BBBFC4">
    <polygon points="268,280 254,273 254,287"/>
    <polygon points="466,280 452,273 452,287"/>
    <polygon points="664,280 650,273 650,287"/>
    <polygon points="862,280 848,273 848,287"/>
    <polygon points="1060,280 1046,273 1046,287"/>
  </g>

  <path d="M 549 342 V 388 H 945 V 344" fill="none" stroke="#D4B45B" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="747" y="378" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#7C651E">浏览器会增量更新，也可能跳过中间阶段</text>

  <g filter="url(#render-shadow)">
    <rect x="48" y="484" width="368" height="210" rx="22" fill="#FEF1CE" stroke="#D4B45B" stroke-width="2"/>
  </g>
  <circle cx="88" cy="524" r="20" fill="#D4B45B"/>
  <text x="88" y="531" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">L</text>
  <text x="122" y="530" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#1F2329">几何变化：从 Layout 开始</text>
  <text x="80" y="570" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">width / height / padding / font-size</text>
  <text x="80" y="598" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">增删可见 DOM、改变正常流位置</text>
  <path d="M 80 628 H 372" fill="none" stroke="#D4B45B" stroke-width="2"/>
  <text x="80" y="657" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">通常：Layout → Paint → Composite</text>

  <g filter="url(#render-shadow)">
    <rect x="456" y="484" width="368" height="210" rx="22" fill="#FEE3E2" stroke="#D25D5A" stroke-width="2"/>
  </g>
  <circle cx="496" cy="524" r="20" fill="#D25D5A"/>
  <text x="496" y="531" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">P</text>
  <text x="530" y="530" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#1F2329">视觉变化：从 Paint 开始</text>
  <text x="488" y="570" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">color / background / border-color</text>
  <text x="488" y="598" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">阴影与部分滤镜会增加绘制成本</text>
  <path d="M 488 628 H 780" fill="none" stroke="#D25D5A" stroke-width="2"/>
  <text x="488" y="657" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">通常：Paint → Composite</text>

  <g filter="url(#render-shadow)">
    <rect x="864" y="484" width="368" height="210" rx="22" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
  </g>
  <circle cx="904" cy="524" r="20" fill="#509863"/>
  <text x="904" y="531" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">C</text>
  <text x="938" y="530" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#1F2329">合成友好：可能只 Composite</text>
  <text x="896" y="570" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">transform / opacity 动画</text>
  <text x="896" y="598" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">是否独立成层由浏览器决定</text>
  <path d="M 896 628 H 1188" fill="none" stroke="#509863" stroke-width="2"/>
  <text x="896" y="657" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">不要把“硬件加速”当成绝对保证</text>

  <rect x="282" y="714" width="716" height="34" rx="17" fill="#1F2329"/>
  <text x="640" y="737" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">布局读取只有在前面存在待提交的几何修改时，才可能迫使浏览器同步刷新</text>
</svg>
