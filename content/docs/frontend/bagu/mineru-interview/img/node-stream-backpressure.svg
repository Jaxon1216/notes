<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F4FC"/>
      <stop offset="1" stop-color="#EAE2FE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F2329" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="1152" height="672" rx="32" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="48" fill="#DFF5E5" opacity="0.8"/>
  <circle cx="114" cy="620" r="62" fill="#FEF1CE" opacity="0.75"/>
  <text x="600" y="78" text-anchor="middle" font-size="30" font-weight="700" fill="#1F2329">Node.js Stream：背压如何限制内存增长</text>
  <text x="600" y="112" text-anchor="middle" font-size="16" fill="#646A73">生产者快于消费者时，write(false) 是暂停信号，不是写入失败</text>

  <g filter="url(#shadow)">
    <rect x="80" y="190" width="250" height="180" rx="24" fill="#FFFFFF" stroke="#5178C6" stroke-width="3"/>
    <circle cx="205" cy="238" r="30" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
    <path d="M190 238 H220 M210 228 L220 238 L210 248" fill="none" stroke="#5178C6" stroke-width="4" stroke-linecap="round"/>
    <text x="205" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#1F2329">Readable</text>
    <text x="205" y="332" text-anchor="middle" font-size="16" fill="#646A73">文件 / 请求体 / 上游</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="475" y="168" width="250" height="224" rx="28" fill="#FFFFFF" stroke="#8569CB" stroke-width="3"/>
    <text x="600" y="216" text-anchor="middle" font-size="24" font-weight="700" fill="#1F2329">内部缓冲区</text>
    <rect x="520" y="246" width="160" height="32" rx="8" fill="#EAE2FE"/>
    <rect x="520" y="286" width="160" height="32" rx="8" fill="#EAE2FE"/>
    <rect x="520" y="326" width="116" height="32" rx="8" fill="#DFF5E5"/>
    <line x1="680" y1="234" x2="680" y2="350" stroke="#D25D5A" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="600" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#D25D5A">highWaterMark 阈值</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="870" y="190" width="250" height="180" rx="24" fill="#FFFFFF" stroke="#509863" stroke-width="3"/>
    <circle cx="995" cy="238" r="30" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
    <path d="M980 238 H1010 M1000 228 L1010 238 L1000 248" fill="none" stroke="#509863" stroke-width="4" stroke-linecap="round"/>
    <text x="995" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#1F2329">Writable</text>
    <text x="995" y="332" text-anchor="middle" font-size="16" fill="#646A73">文件 / 响应 / 下游</text>
  </g>

  <polyline points="330,270 410,270 410,250 475,250" fill="none" stroke="#BBBFC4" stroke-width="5"/>
  <polygon points="475,250 459,241 459,259" fill="#BBBFC4"/>
  <text x="402" y="230" text-anchor="middle" font-size="16" font-weight="600" fill="#5178C6">chunk</text>
  <polyline points="725,250 790,250 790,270 870,270" fill="none" stroke="#BBBFC4" stroke-width="5"/>
  <polygon points="870,270 854,261 854,279" fill="#BBBFC4"/>

  <path d="M870 410 C790 500 410 500 330 410" fill="none" stroke="#D25D5A" stroke-width="5" stroke-dasharray="12 9"/>
  <polygon points="330,410 347,413 338,427" fill="#D25D5A"/>
  <rect x="420" y="438" width="360" height="66" rx="18" fill="#FEE3E2" stroke="#D25D5A" stroke-width="2"/>
  <text x="600" y="466" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2329">write() 返回 false → 暂停读取</text>
  <text x="600" y="491" text-anchor="middle" font-size="15" fill="#646A73">消费者排空缓冲后触发 drain，再继续生产</text>

  <rect x="242" y="558" width="716" height="82" rx="22" fill="#1F2329"/>
  <text x="600" y="590" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">pipe() 协调常见背压；多段流优先使用 pipeline()</text>
  <text x="600" y="618" text-anchor="middle" font-size="15" fill="#DDE2EA">统一传播错误、销毁资源，并避免缓冲无限堆积</text>
</svg>
