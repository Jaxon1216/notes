<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="diff-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F0F4FC"/>
    </linearGradient>
    <filter id="diff-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1F2329" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#diff-bg)"/>
  <text x="60" y="62" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#1F2329">Vue 2 双端 Diff：四次头尾比较与 key 回退</text>
  <text x="60" y="94" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#646A73">只比较同一父节点下的 children，指针从两端向中间收拢</text>

  <rect x="60" y="130" width="1080" height="175" rx="24" fill="#FFFFFF" stroke="#5178C6" stroke-width="2" filter="url(#diff-shadow)"/>
  <text x="88" y="163" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#1F2329">当前窗口</text>
  <text x="88" y="198" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">旧 children</text>
  <text x="88" y="264" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">新 children</text>

  <rect x="225" y="176" width="120" height="46" rx="12" fill="#F0F4FC" stroke="#5178C6" stroke-width="3"/>
  <text x="285" y="205" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#1F2329">oldStart</text>
  <rect x="385" y="176" width="90" height="46" rx="12" fill="#FFFFFF" stroke="#5178C6" stroke-width="2"/>
  <text x="430" y="205" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#1F2329">...</text>
  <rect x="515" y="176" width="120" height="46" rx="12" fill="#EAE2FE" stroke="#8569CB" stroke-width="3"/>
  <text x="575" y="205" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#1F2329">oldEnd</text>

  <rect x="705" y="242" width="120" height="46" rx="12" fill="#DFF5E5" stroke="#509863" stroke-width="3"/>
  <text x="765" y="271" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#1F2329">newStart</text>
  <rect x="865" y="242" width="90" height="46" rx="12" fill="#FFFFFF" stroke="#509863" stroke-width="2"/>
  <text x="910" y="271" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#1F2329">...</text>
  <rect x="995" y="242" width="120" height="46" rx="12" fill="#FEF1CE" stroke="#D4B45B" stroke-width="3"/>
  <text x="1055" y="271" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#1F2329">newEnd</text>

  <path d="M285 222 C330 275 650 300 765 288" fill="none" stroke="#BBBFC4" stroke-width="3"/>
  <path d="M575 222 C665 150 970 170 1055 242" fill="none" stroke="#BBBFC4" stroke-width="3"/>
  <path d="M575 222 C625 250 660 265 705 265" fill="none" stroke="#8569CB" stroke-width="4"/>
  <polygon points="705,265 684,254 684,276" fill="#8569CB"/>
  <path d="M345 199 C560 115 865 150 995 265" fill="none" stroke="#5178C6" stroke-width="4" stroke-dasharray="10 8"/>
  <polygon points="995,265 973,258 983,241" fill="#5178C6"/>

  <rect x="60" y="345" width="1080" height="225" rx="24" fill="#FFFFFF" stroke="#8569CB" stroke-width="2" filter="url(#diff-shadow)"/>
  <text x="88" y="380" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#1F2329">每轮按顺序命中即处理</text>

  <rect x="88" y="408" width="230" height="126" rx="18" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
  <circle cx="116" cy="436" r="17" fill="#5178C6"/>
  <text x="116" y="442" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
  <text x="145" y="442" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">头 ↔ 头</text>
  <text x="112" y="475" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">patch，两个头指针右移</text>
  <text x="112" y="504" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">节点位置通常无需移动</text>

  <rect x="342" y="408" width="230" height="126" rx="18" fill="#EAE2FE" stroke="#8569CB" stroke-width="2"/>
  <circle cx="370" cy="436" r="17" fill="#8569CB"/>
  <text x="370" y="442" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
  <text x="399" y="442" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">尾 ↔ 尾</text>
  <text x="366" y="475" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">patch，两个尾指针左移</text>
  <text x="366" y="504" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">节点位置通常无需移动</text>

  <rect x="596" y="408" width="230" height="126" rx="18" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
  <circle cx="624" cy="436" r="17" fill="#509863"/>
  <text x="624" y="442" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
  <text x="653" y="442" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">旧头 ↔ 新尾</text>
  <text x="620" y="475" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">patch 后把旧头移到右侧</text>
  <text x="620" y="504" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">旧头右移，新尾左移</text>

  <rect x="850" y="408" width="262" height="126" rx="18" fill="#FEF1CE" stroke="#D4B45B" stroke-width="2"/>
  <circle cx="878" cy="436" r="17" fill="#D4B45B"/>
  <text x="878" y="442" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
  <text x="907" y="442" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">旧尾 ↔ 新头</text>
  <text x="874" y="475" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">patch 后把旧尾移到左侧</text>
  <text x="874" y="504" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">旧尾左移，新头右移</text>

  <rect x="160" y="605" width="880" height="55" rx="27" fill="#1F2329"/>
  <text x="600" y="630" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">四种都未命中：按 newStart.key 查旧节点 → 移动并 patch；找不到则创建</text>
  <text x="600" y="651" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#FFFFFF">Vue 3 keyed Diff 已改为前后缀 + key 映射 + 最长递增子序列</text>
</svg>
