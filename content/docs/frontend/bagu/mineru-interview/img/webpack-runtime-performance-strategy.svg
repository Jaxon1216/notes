<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780">
  <rect x="10" y="10" width="1380" height="760" rx="28" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="2"/>
  <text x="700" y="48" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="26" font-weight="700" fill="#1F2329">Webpack 运行性能：删除、拆分与缓存各解决不同问题</text>
  <text x="700" y="74" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">先从 ESM 模块图识别活代码，再规划加载边界，最后用稳定 hash 提升长期缓存命中</text>

  <rect x="40" y="108" width="350" height="610" rx="24" fill="#F0F4FC" stroke="#5178C6" stroke-width="2"/>
  <rect x="66" y="132" width="156" height="36" rx="18" fill="#5178C6"/>
  <text x="144" y="157" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">源代码模块图</text>

  <circle cx="210" cy="245" r="58" fill="#1F2329" stroke="#1F2329" stroke-width="2"/>
  <text x="210" y="240" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">entry</text>
  <text x="210" y="264" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#FFFFFF">首屏入口</text>

  <circle cx="105" cy="390" r="55" fill="#FFFFFF" stroke="#509863" stroke-width="2"/>
  <text x="105" y="385" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">used export</text>
  <text x="105" y="409" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#509863">被入口引用</text>

  <circle cx="210" cy="505" r="55" fill="#FFFFFF" stroke="#D25D5A" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="210" y="500" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">unused export</text>
  <text x="210" y="524" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#D25D5A">无活引用</text>

  <circle cx="315" cy="390" r="55" fill="#FFFFFF" stroke="#8569CB" stroke-width="2"/>
  <text x="315" y="385" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1F2329">dynamic import</text>
  <text x="315" y="409" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#8569CB">异步边界</text>

  <polyline points="178,292 125,335" fill="none" stroke="#BBBFC4" stroke-width="3"/>
  <polygon points="119,342 124,326 135,339" fill="#BBBFC4"/>
  <polyline points="210,303 210,442" fill="none" stroke="#BBBFC4" stroke-width="3"/>
  <polygon points="210,450 202,436 218,436" fill="#BBBFC4"/>
  <polyline points="242,292 295,335" fill="none" stroke="#BBBFC4" stroke-width="3"/>
  <polygon points="301,342 285,339 296,326" fill="#BBBFC4"/>

  <rect x="78" y="598" width="274" height="84" rx="16" fill="#FEF1CE" stroke="#D4B45B" stroke-width="2"/>
  <text x="98" y="629" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">sideEffects 是安全承诺</text>
  <text x="98" y="654" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">CSS、polyfill、注册模块不可误标</text>
  <text x="98" y="674" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">否则整文件可能被错误删除</text>

  <rect x="440" y="108" width="460" height="282" rx="24" fill="#DFF5E5" stroke="#509863" stroke-width="2"/>
  <rect x="466" y="132" width="174" height="36" rx="18" fill="#509863"/>
  <text x="553" y="157" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Tree Shaking</text>
  <text x="474" y="205" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#1F2329">目标：减少“最终包含什么”</text>
  <rect x="474" y="232" width="176" height="70" rx="14" fill="#FFFFFF" stroke="#509863" stroke-width="2"/>
  <text x="562" y="260" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#1F2329">usedExports</text>
  <text x="562" y="284" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">标记活绑定</text>
  <rect x="690" y="232" width="176" height="70" rx="14" fill="#FFFFFF" stroke="#509863" stroke-width="2"/>
  <text x="778" y="260" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#1F2329">Minifier</text>
  <text x="778" y="284" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">删除可证明死代码</text>
  <rect x="474" y="326" width="392" height="38" rx="19" fill="#FFFFFF" stroke="#509863" stroke-width="2"/>
  <text x="670" y="351" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">依赖 ESM 静态结构，并正确声明模块副作用</text>

  <rect x="440" y="436" width="460" height="282" rx="24" fill="#EAE2FE" stroke="#8569CB" stroke-width="2"/>
  <rect x="466" y="460" width="174" height="36" rx="18" fill="#8569CB"/>
  <text x="553" y="485" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Code Splitting</text>
  <text x="474" y="533" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#1F2329">目标：控制“何时加载什么”</text>
  <rect x="474" y="560" width="176" height="70" rx="14" fill="#FFFFFF" stroke="#8569CB" stroke-width="2"/>
  <text x="562" y="588" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#1F2329">import()</text>
  <text x="562" y="612" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">路由 / 功能异步加载</text>
  <rect x="690" y="560" width="176" height="70" rx="14" fill="#FFFFFF" stroke="#8569CB" stroke-width="2"/>
  <text x="778" y="588" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#1F2329">splitChunks</text>
  <text x="778" y="612" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">提取共享依赖</text>
  <rect x="474" y="654" width="392" height="38" rx="19" fill="#FFFFFF" stroke="#8569CB" stroke-width="2"/>
  <text x="670" y="679" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#1F2329">拆分过细会增加调度、请求与重复依赖成本</text>

  <polyline points="390,285 432,248" fill="none" stroke="#509863" stroke-width="3"/>
  <polygon points="440,241 433,256 423,244" fill="#509863"/>
  <polyline points="390,455 432,525" fill="none" stroke="#8569CB" stroke-width="3"/>
  <polygon points="440,533 425,526 438,518" fill="#8569CB"/>

  <rect x="950" y="108" width="410" height="610" rx="24" fill="#FEF1CE" stroke="#D4B45B" stroke-width="2"/>
  <rect x="976" y="132" width="198" height="36" rx="18" fill="#D4B45B"/>
  <text x="1075" y="157" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">产物与长期缓存</text>
  <text x="984" y="208" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#1F2329">输出多个职责明确的 chunk</text>

  <rect x="990" y="236" width="330" height="74" rx="16" fill="#FFFFFF" stroke="#5178C6" stroke-width="2"/>
  <text x="1014" y="265" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">main.a1b2.js</text>
  <text x="1014" y="290" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">首屏必需代码：优先加载</text>

  <rect x="990" y="330" width="330" height="74" rx="16" fill="#FFFFFF" stroke="#8569CB" stroke-width="2"/>
  <text x="1014" y="359" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">admin.c3d4.js</text>
  <text x="1014" y="384" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">异步功能代码：按需加载</text>

  <rect x="990" y="424" width="330" height="74" rx="16" fill="#FFFFFF" stroke="#509863" stroke-width="2"/>
  <text x="1014" y="453" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1F2329">vendors.e5f6.js</text>
  <text x="1014" y="478" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">共享依赖：跨页面复用缓存</text>

  <ellipse cx="1155" cy="584" rx="150" ry="66" fill="#FFFFFF" stroke="#D4B45B" stroke-width="2"/>
  <text x="1155" y="570" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#1F2329">[contenthash]</text>
  <text x="1155" y="596" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#646A73">内容不变，URL 尽量稳定</text>
  <text x="1155" y="619" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#646A73">浏览器 / CDN 继续命中缓存</text>

  <polyline points="900,250 942,250" fill="none" stroke="#509863" stroke-width="3"/>
  <polygon points="950,250 938,243 938,257" fill="#509863"/>
  <polyline points="900,578 942,578" fill="none" stroke="#8569CB" stroke-width="3"/>
  <polygon points="950,578 938,571 938,585" fill="#8569CB"/>

  <rect x="1000" y="670" width="310" height="28" rx="14" fill="#FEE3E2" stroke="#D25D5A" stroke-width="2"/>
  <text x="1155" y="690" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#1F2329">用真实瀑布、体积与主线程指标验证收益</text>
</svg>
