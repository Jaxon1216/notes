<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F4FC"/>
      <stop offset="1" stop-color="#EAE2FE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1F2329" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="1152" height="712" rx="32" fill="url(#bg)"/>
  <text x="600" y="76" text-anchor="middle" font-size="30" font-weight="700" fill="#1F2329">微信小程序：逻辑层、宿主桥接与渲染层</text>
  <text x="600" y="108" text-anchor="middle" font-size="16" fill="#646A73">业务代码不能直接操作 DOM；数据和事件都要跨层通信</text>

  <g filter="url(#shadow)">
    <rect x="70" y="168" width="355" height="374" rx="28" fill="#F0F4FC" stroke="#5178C6" stroke-width="3"/>
    <circle cx="248" cy="230" r="38" fill="#FFFFFF" stroke="#5178C6" stroke-width="3"/>
    <path d="M232 230 H264 M248 214 V246" stroke="#5178C6" stroke-width="4" stroke-linecap="round"/>
    <text x="248" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#1F2329">逻辑层</text>
    <text x="248" y="336" text-anchor="middle" font-size="16" fill="#646A73">页面逻辑与业务数据</text>
    <text x="248" y="368" text-anchor="middle" font-size="16" fill="#646A73">平台 API 调用</text>
    <text x="248" y="400" text-anchor="middle" font-size="16" fill="#646A73">网络、存储、定时任务</text>
    <rect x="126" y="440" width="244" height="60" rx="16" fill="#FFFFFF" stroke="#5178C6" stroke-width="2"/>
    <text x="248" y="476" text-anchor="middle" font-size="18" font-weight="700" fill="#5178C6">setData(变更)</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M535 148 H665 L704 198 V542 L665 592 H535 L496 542 V198 Z" fill="#FEF1CE" stroke="#D4B45B" stroke-width="3"/>
    <circle cx="600" cy="240" r="42" fill="#FFFFFF" stroke="#D4B45B" stroke-width="3"/>
    <path d="M580 240 H620 M600 220 V260" stroke="#D4B45B" stroke-width="4" stroke-linecap="round"/>
    <text x="600" y="316" text-anchor="middle" font-size="23" font-weight="700" fill="#1F2329">微信客户端宿主</text>
    <text x="600" y="354" text-anchor="middle" font-size="16" fill="#646A73">序列化与消息桥接</text>
    <text x="600" y="386" text-anchor="middle" font-size="16" fill="#646A73">原生组件与系统能力</text>
    <text x="600" y="418" text-anchor="middle" font-size="16" fill="#646A73">生命周期和调度</text>
    <rect x="530" y="458" width="140" height="62" rx="16" fill="#FFFFFF" stroke="#D4B45B" stroke-width="2"/>
    <text x="600" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2329">通信有成本</text>
    <text x="600" y="507" text-anchor="middle" font-size="13" fill="#646A73">减少频率和数据量</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="775" y="168" width="355" height="374" rx="28" fill="#DFF5E5" stroke="#509863" stroke-width="3"/>
    <circle cx="952" cy="230" r="38" fill="#FFFFFF" stroke="#509863" stroke-width="3"/>
    <rect x="934" y="214" width="36" height="32" rx="4" fill="none" stroke="#509863" stroke-width="4"/>
    <text x="952" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#1F2329">渲染层</text>
    <text x="952" y="336" text-anchor="middle" font-size="16" fill="#646A73">WXML / WXSS / 组件视图</text>
    <text x="952" y="368" text-anchor="middle" font-size="16" fill="#646A73">WebView 或 Skyline 等实现</text>
    <text x="952" y="400" text-anchor="middle" font-size="16" fill="#646A73">视图更新与用户交互</text>
    <rect x="830" y="440" width="244" height="60" rx="16" fill="#FFFFFF" stroke="#509863" stroke-width="2"/>
    <text x="952" y="476" text-anchor="middle" font-size="18" font-weight="700" fill="#509863">用户事件</text>
  </g>

  <polyline points="425,455 496,455" fill="none" stroke="#BBBFC4" stroke-width="5"/>
  <polygon points="496,455 480,446 480,464" fill="#BBBFC4"/>
  <polyline points="704,455 775,455" fill="none" stroke="#BBBFC4" stroke-width="5"/>
  <polygon points="775,455 759,446 759,464" fill="#BBBFC4"/>
  <polyline points="775,505 704,505" fill="none" stroke="#BBBFC4" stroke-width="5"/>
  <polygon points="704,505 720,496 720,514" fill="#BBBFC4"/>
  <polyline points="496,505 425,505" fill="none" stroke="#BBBFC4" stroke-width="5"/>
  <polygon points="425,505 441,496 441,514" fill="#BBBFC4"/>

  <rect x="140" y="606" width="920" height="84" rx="24" fill="#1F2329"/>
  <text x="600" y="639" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">优化 setData：只传视图需要的字段，合并更新，按路径局部更新</text>
  <text x="600" y="668" text-anchor="middle" font-size="15" fill="#DDE2EA">跨层更新是异步过程，不要假设调用后视图已立即完成渲染</text>
</svg>
